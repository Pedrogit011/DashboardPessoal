<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Pessoal | SENAI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                   <i class="fas fa-chart-line"></i>
                   <span>AdminPro</span>
                </div>
                <button class="sidebat-toggle" id="sidebar-toggle">
                    <i class="fas fa-bars"></i>
                </button>
            </div>

            <nav class="sidebar-nav">
                <ul>
                    <li class="active">
                        <a href="#">
                            <i class=" fas fa-tachometer-alt"></i>
                             
                </ul>        
                        </a>
                    </li>
                     <li class="active">
                        <a href="#">
                            <i class="fas fa-users"></i>
                                <span>Usuários</span>
                            
                        </a>
                    </li>
                     <li class="active">
                        <a href="#">
                            <i class="fas fa-shopping-cart"></i>
                                <span>Vendas</span>
                            
                        </a>
                    </li>
                     <li class="active">
                        <a href="#">
                            <i class="fas fa-chart-bar"></i>
                                <span>Relatórios</span>
                            
                        </a>
                    </li>
                     <li class="active">
                        <a href="#">
                            <i class="fas fa-cog"></i>
                                <span>Configurações</span>
                            
                        </a>
                    </li>
                </ul>
            </nav>
            <div class="sidebar-footer">
                <a href="#">
                    <i class=" fas fa-sign-out-alt"></i>
                    <span>Sair</span>
                </a>
            </div>
        </aside>
       <!--Conteúdo Principal-->
       <div class="mais-content">
        <header class="topbar">
            <div class="search-area">
             <i class="fas fa-search"></i>
             <input type="text" placeholder="pesquisa....">
             </div>
             <div class="user-area">
                <button class="dark-mode-toogle" id="darckmodetoggle">
                    <i class="fas fa-moon"></i>
                </button>
              
                <div class="notification">
                  <i class="fas fa-bell"></i>
                  <span class="badge">67</span>
                </div>
                <div class="user-profile">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/c/c5/Coringa_Victor_2024.jpg/960px-Coringa_Victor_2024.jpg" alt="">

                </div>
             </div>
          </header>
       </div>
    </div>
</body>
</html>
